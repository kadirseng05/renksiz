<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ters Renk Oyunu</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#efeaf9;--tx:#1b1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0a1a;--tx:#f1edff}}
:root[data-theme="dark"]{--bg:#0e0a1a;--tx:#f1edff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center;align-items:center;padding:16px;overflow:hidden;position:relative}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;animation:float 12s ease-in-out infinite alternate}
.b1{width:320px;height:320px;background:#ff5fb0;top:-80px;left:-80px}
.b2{width:360px;height:360px;background:#4d8dff;bottom:-120px;right:-100px;animation-delay:-6s}
@keyframes float{to{transform:translate(60px,50px) scale(1.2)}}
.card{position:relative;z-index:1;width:100%;max-width:440px;background:#1c1630;color:#f1edff;border-radius:26px;padding:22px;text-align:center;box-shadow:0 14px 50px rgba(0,0,0,.35);animation:rise .5s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.95)}}
h1{margin:4px 0 6px;font-size:32px;background:linear-gradient(90deg,#ff5fb0,#ffd93d,#3ddc84,#4d8dff);-webkit-background-clip:text;background-clip:text;color:transparent;background-size:200%;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:200%}}
.sub{margin:0 0 14px;color:#a79fc6;font-size:15px;line-height:1.5}
.hero{font-size:clamp(46px,14vw,70px);font-weight:800;min-height:90px;display:flex;align-items:center;justify-content:center}
.top{display:flex;justify-content:space-between;font-size:14px;color:#a79fc6;margin-bottom:14px}
#sc.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(2) rotate(-6deg);color:#7cf5b0}}
.bar{height:10px;background:#2c2448;border-radius:99px;overflow:hidden;margin-bottom:22px}
#fill{height:100%;width:100%;border-radius:99px;transition:background .3s}
#fill.low{animation:pulse .4s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}
#word{font-size:clamp(46px,14vw,70px);font-weight:800;letter-spacing:1px;min-height:92px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.4,1)}
@keyframes pop{0%{opacity:0;transform:scale(.1) rotate(-25deg)}60%{opacity:1;transform:scale(1.35) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
#combo{min-height:30px;font-size:22px;font-weight:800;color:#ffd93d;margin-bottom:8px}
.msg{margin:0 0 14px;color:#a79fc6;font-size:15px;line-height:1.5;min-height:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{height:78px;border:0;border-radius:18px;cursor:pointer;transition:transform .1s,filter .2s;animation:in .4s backwards cubic-bezier(.2,1.5,.4,1)}
.opt:nth-child(2){animation-delay:.05s}.opt:nth-child(3){animation-delay:.1s}.opt:nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:translateY(60px) scale(.4) rotate(-10deg)}}
.opt:hover{filter:brightness(1.15)}
.opt:active{transform:scale(.92)}
.opt.hint{animation:hint .5s 3;outline:4px solid #fff}
@keyframes hint{50%{transform:scale(1.12)}}
.btn{display:block;width:100%;margin-top:12px;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;cursor:pointer;background:#ff5fb0;color:#fff;transition:transform .1s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}
.btn.alt{background:#2c2448;color:#f1edff}
.btn.ghost{background:transparent;color:#a79fc6;font-size:14px;padding:8px;margin-top:6px}
.shake{animation:shake .5s}
@keyframes shake{15%{transform:translateX(-24px) rotate(-2deg)}35%{transform:translateX(24px) rotate(2deg)}55%{transform:translateX(-16px)}75%{transform:translateX(12px)}}
.card{transition:transform .15s,box-shadow .2s}
.red{box-shadow:0 0 0 6px #ff4d4dcc,0 0 70px #ff4d4d99}
.green{transform:scale(1.04);box-shadow:0 0 0 5px #3ddc84cc,0 0 70px #3ddc8499}
.gold{transform:scale(1.06);box-shadow:0 0 0 6px #ffd93dcc,0 0 90px #ffd93dbb}
.p{position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;z-index:9;box-shadow:0 0 12px currentColor}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:clamp(34px,10vw,56px);font-weight:900;color:#fff;text-shadow:0 0 30px #ffd93d;z-index:10;pointer-events:none;opacity:0}
#banner.show{animation:ban 1.5s}
@keyframes ban{0%{opacity:0;transform:scale(.2) rotate(-15deg)}25%{opacity:1;transform:scale(1.4) rotate(4deg)}45%{transform:scale(1) rotate(0)}80%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(2)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<main class="card" id="card">
  <section id="menu">
    <h1>Ters Renk</h1>
    <p class="sub">Yazı ne diyor değil, <b>ne renk</b> olduğuna bak!</p>
    <div class="hero" id="hero">Yellow</div>
    <button class="btn alt" id="bPrev">👀 Önizleme (süresiz deneme)</button>
    <button class="btn" id="bPlay">▶ Oyna</button>
    <p class="sub" id="best" style="margin-top:14px"></p>
  </section>
  <section id="game" hidden>
    <div class="top"><span id="sc">Skor: 0</span><span id="lv">Seviye 1</span><span id="lf"></span></div>
    <div class="bar" id="barWrap"><div id="fill"></div></div>
    <div id="word"></div>
    <div id="combo"></div>
    <p class="msg" id="msg"></p>
    <div class="grid" id="grid"></div>
    <button class="btn" id="again" hidden>Tekrar oyna</button>
    <button class="btn ghost" id="back">← Menü</button>
  </section>
</main>
<div id="banner"></div>
<script>
const C=[{n:"Red",c:"#ff4d4d"},{n:"Blue",c:"#4d8dff"},{n:"Green",c:"#3ddc84"},{n:"Yellow",c:"#ffd93d"},{n:"Pink",c:"#ff5fb0"}];
const $=id=>document.getElementById(id);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
let mode,score,right,lives,limit,start,cur,run=false,busy=false,raf,streak,pIdx,best=0,heroT;
try{best=+localStorage.getItem("tersrenk-best")||0}catch(e){}

function retrigger(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function heroTick(){
  const ink=rnd(C),w=rnd(C.filter(x=>x!==ink));
  const h=$("hero");h.textContent=w.n;h.style.color=ink.c;retrigger(h,"pop");
}
function showMenu(){
  run=false;cancelAnimationFrame(raf);
  $("game").hidden=true;$("menu").hidden=false;
  $("best").textContent=best?"🏆 En iyi skor: "+best:"";
  clearInterval(heroT);heroTick();heroT=setInterval(heroTick,1300);
}
function burst(el,color){
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<30;i++){
    const p=document.createElement("span");p.className="p";p.style.background=color;p.style.left=x+"px";p.style.top=y+"px";
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=90+Math.random()*150;p.style.color=color;
    p.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:800+Math.random()*500,easing:"cubic-bezier(.2,.8,.4,1)"}).onfinish=()=>p.remove();
  }
}
function banner(t){const b=$("banner");b.textContent=t;retrigger(b,"show")}
function flash(c){const k=$("card");k.classList.remove("green","gold");void k.offsetWidth;k.classList.add(c);setTimeout(()=>k.classList.remove(c),450)}
function hud(){
  if(mode==="preview"){$("sc").textContent="Önizleme";$("lv").textContent=Math.min(pIdx+1,5)+" / 5";$("lf").textContent="∞";return}
  $("sc").textContent="Skor: "+score;$("lv").textContent="Seviye "+(Math.floor(right/10)+1);
  $("lf").textContent="❤".repeat(lives)+"🖤".repeat(3-lives);
}
function next(){
  busy=false;
  const ink=rnd(C),word=rnd(C.filter(x=>x!==ink));
  const others=C.filter(x=>x!==ink&&x!==word).sort(()=>Math.random()-.5).slice(0,2);
  const opts=[ink,word,...others].sort(()=>Math.random()-.5);
  cur={ink,word};
  const w=$("word");w.textContent=word.n;w.style.color=ink.c;retrigger(w,"pop");
  const g=$("grid");g.innerHTML="";
  opts.forEach(o=>{const b=document.createElement("button");b.className="opt";b.style.background=o.c;b.setAttribute("aria-label",o.n);b.dataset.n=o.n;b.onclick=()=>pick(o,b);g.appendChild(b)});
  start=performance.now();hud();
}
function wrong(){
  streak=0;$("combo").textContent="";
  retrigger($("card"),"shake");
  const c=$("card");c.classList.add("red");setTimeout(()=>c.classList.remove("red"),400);
}
function pick(o,btn){
  if(busy||(!run&&mode!=="preview"))return;
  const ok=o===cur.ink;
  if(mode==="preview"){
    busy=true;
    if(ok){burst(btn,o.c);$("msg").textContent="✅ Doğru! Yazı "+cur.ink.n+" renkliydi, "+cur.word.n+" yazması önemli değil.";pIdx++}
    else{wrong();$("msg").textContent="❌ Rengine bakmalıydın: yazı "+cur.ink.n+" renkliydi.";
      document.querySelectorAll(".opt").forEach(b=>{if(b.dataset.n===cur.ink.n)b.classList.add("hint")})}
    hud();
    setTimeout(()=>{if(pIdx>=5)return previewDone();next()},ok?1300:1900);
    return;
  }
  if(ok){
    burst(btn,o.c);flash("green");score+=10;right++;streak++;
    retrigger($("sc"),"bump");
    $("combo").textContent=streak>=3?"🔥 x"+streak+" seri":"";if(streak>=3)retrigger($("combo"),"pop");
    if(right%10===0){limit=Math.max(900,limit*0.85);banner("⚡ HIZLANDI!");flash("gold");$("msg").textContent="Yeni süre: "+(limit/1000).toFixed(1)+" sn"}
    next();
  }else lose();
}
function lose(){
  lives--;wrong();hud();
  if(lives<=0)return end();
  next();
}
function previewDone(){
  $("word").textContent="Hazırsın! 🎉";$("word").style.color="#7cf5b0";retrigger($("word"),"pop");
  $("grid").innerHTML="";$("msg").textContent="Önizleme bitti. Şimdi süreli oyunu dene!";
  $("again").textContent="▶ Gerçek oyunu başlat";$("again").hidden=false;$("again").onclick=()=>startGame("play");
}
function tick(){
  if(!run)return;
  const left=1-(performance.now()-start)/limit,f=$("fill");
  f.style.width=Math.max(0,left*100)+"%";
  f.style.background=left>.5?"#7cf5b0":left>.25?"#ffd93d":"#ff4d4d";
  f.classList.toggle("low",left<.25);
  if(left<=0){start=performance.now();lose()}
  raf=requestAnimationFrame(tick);
}
function end(){
  run=false;cancelAnimationFrame(raf);
  if(score>best){best=score;try{localStorage.setItem("tersrenk-best",best)}catch(e){}banner("🏆 Yeni rekor!")}
  $("word").textContent="Bitti!";$("word").style.color="#ff5fb0";retrigger($("word"),"pop");
  $("grid").innerHTML="";$("combo").textContent="";
  $("msg").textContent="Skor: "+score+" · Doğru: "+right+" · En iyi: "+best;
  $("again").textContent="Tekrar oyna";$("again").hidden=false;$("again").onclick=()=>startGame("play");
}
function startGame(m){
  mode=m;score=0;right=0;lives=3;limit=4000;streak=0;pIdx=0;busy=false;
  clearInterval(heroT);cancelAnimationFrame(raf);
  $("menu").hidden=true;$("game").hidden=false;$("again").hidden=true;$("combo").textContent="";
  $("barWrap").hidden=m==="preview";
  $("msg").textContent=m==="preview"?"Süre yok, can yok. Yazının rengine tıkla ve nedenini oku!":"Yazının rengine tıkla!";
  run=m==="play";next();
  if(run)raf=requestAnimationFrame(tick);
}
$("bPlay").onclick=()=>startGame("play");
$("bPrev").onclick=()=>startGame("preview");
$("back").onclick=showMenu;
showMenu();
</script>
</body>
</html>
